[pytest]
# Run from the repo root:
#   pytest tests/hil --embedded-services esp,idf --target esp32h2 \
#     --app-path firmware/esp_idf --port /dev/ttyUSB0
markers =
    esp32h2: needs an ESP32-H2 dev kit on the runner
    bench_rig: needs the wired sensor rig described in docs/hardware/bringup.md
