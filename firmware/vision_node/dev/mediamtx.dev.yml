# Virtual Vision Node on the development Mac (ADR 0020): MediaMTX serves an ffmpeg test pattern
# as "cam", like the Pi's rpiCamera path. Dev password only (deploy/frigate: FRIGATE_RTSP_PASSWORD).
logLevel: warn
api: true
apiAddress: 127.0.0.1:9997
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
hls: false
webrtc: false
srt: false
moq: false
authMethod: internal
authInternalUsers:
  - user: talos
    pass: dev-rtsp-password
    ips: []
    permissions:
      - action: read
        path: cam
  # The test-pattern publisher when ffmpeg runs in a container (dev/run_virtual.sh).
  - user: publisher
    pass: dev-publish
    ips: []
    permissions:
      - action: publish
        path: cam
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: publish
        path: cam
      - action: read
        path: cam
paths:
  # Published by dev/run_virtual.sh: ffmpeg's test pattern, from this Mac or from a container.
  cam:
    source: publisher
