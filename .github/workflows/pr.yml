name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [default, asan, ubsan]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ matrix.config }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ matrix.config }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-${{ matrix.config }}-
      - name: Test
        # GCC's UBSan cannot compile abseil (constexpr function-pointer
        # comparisons), so the ubsan job uses clang. default/asan stay on GCC.
        env:
          CC: ${{ matrix.config == 'ubsan' && 'clang' || 'gcc' }}
        run: |
          extra=""
          if [ "${{ matrix.config }}" != "default" ]; then extra="--config=${{ matrix.config }}"; fi
          # Linux keeps the alignment check that .bazelrc disables for macOS.
          if [ "${{ matrix.config }}" = "ubsan" ]; then extra="$extra --copt=-fsanitize=alignment"; fi
          bazel test --config=ci $extra //...
      - name: Bench tools against the virtual board
        # tools/hil and tools/bench drive firmware/sim:bench_node exactly as they drive a real
        # board over USB, including the serial bridge into a real hub.
        if: matrix.config == 'default'
        run: |
          bazel build --config=ci //firmware/sim:bench_node //server:talos_hub
          export TALOS_BENCH_NODE=$PWD/bazel-bin/firmware/sim/bench_node TALOS_HUB=$PWD/bazel-bin/server/talos_hub
          (cd tools/hil && python3 -m unittest discover -s tests -t . -v)
          if [ -d tools/bench ]; then (cd tools/bench && python3 -m unittest discover -s tests -t . -v); fi
          # Vision Node agent and SD-card provisioning, including the agent against the real hub.
          (cd firmware/vision_node && python3 -m unittest discover -s tests -t . -v)
      - name: Upload scenario traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs-${{ matrix.config }}
          path: bazel-testlogs/**/test.outputs/
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install clang-format==21.1.8
      - run: git ls-files '*.cc' '*.h' | xargs clang-format --dry-run --Werror

  proto:
    name: Protobuf (buf)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:lint
      - name: Breaking-change check
        if: github.event_name == 'pull_request'
        run: pnpm exec buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ts:check

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-e2e-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-e2e-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-e2e-
      - name: Build hub
        run: bazel build --config=ci //server:talos_hub
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:gen
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: pnpm -C web e2e
        env:
          CI: "1"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  hardware:
    name: Hardware (KiCad ERC + netlist)
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.8-full
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - name: Generated schematics and libraries are up to date
        env:
          KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
          KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 hardware/scripts/gen_schematics.py
          python3 hardware/scripts/pi_config.py
          git diff --exit-code -- hardware/kicad
      - name: ERC, netlist round-trip, cross-board, safe-default and PCB DRC checks
        env:
          KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
        run: python3 hardware/scripts/check_kicad.py
      - name: Layout invariants (templates, thermal vias, holes, labels, power necks)
        run: python3 hardware/scripts/layout_rules.py
      - name: Hardware generator unit tests
        run: python3 -m unittest discover -s hardware/scripts/tests -t hardware/scripts -v
      - name: Power budget model (TL-SN-002)
        run: python3 hardware/scripts/power_budget_sn2.py --out /tmp/power-budget-sn2.md
      - name: Circuit simulation (ngspice from the KiCad image; verdicts match hardware/results/spice.md)
        run: python3 hardware/scripts/spice_sim.py --check
      - name: JLCPCB sourcing (every assembled part stocked, offline snapshot)
        run: python3 hardware/scripts/jlc_sourcing.py check
      - name: Debug-adapter host tool (simulated MCP2221A)
        working-directory: tools/dbg
        run: python3 -m unittest discover -s tests -t . -v

  esp-idf:
    name: ESP32-H2 firmware build
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v7
      - name: Build portable firmware for esp32h2
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/esp_idf
          idf.py set-target esp32h2
          idf.py build
          ls -l build/*.bin
      - name: Build the production security profile (compile only; unsigned, no key, burns nothing)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/esp_idf
          idf.py -B build_production -D SDKCONFIG=build_production/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.production" set-target esp32h2 build
          ls -l build_production/*.bin build_production/bootloader/bootloader.bin
          # Kconfig drops unknown or unmet options with a warning only: check each one took.
          cfg=build_production/sdkconfig
          for opt in CONFIG_SECURE_BOOT=y CONFIG_SECURE_BOOT_V2_ENABLED=y \
                     CONFIG_SECURE_SIGNED_APPS_RSA_SCHEME=y CONFIG_SECURE_FLASH_ENC_ENABLED=y \
                     CONFIG_SECURE_FLASH_ENCRYPTION_MODE_RELEASE=y \
                     CONFIG_SECURE_ENABLE_SECURE_ROM_DL_MODE=y CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y \
                     CONFIG_PARTITION_TABLE_OFFSET=0xF000 CONFIG_TALOS_BOARD_TL_SN_002=y \
                     CONFIG_NVS_ENCRYPTION=y CONFIG_NVS_SEC_KEY_PROTECT_USING_HMAC=y \
                     CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=y CONFIG_OPENTHREAD_ENABLED=y; do
            grep -qix "$opt" "$cfg" || { echo "production profile lost $opt"; exit 1; }
          done
          for opt in CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES CONFIG_SECURE_BOOT_ALLOW_JTAG \
                     CONFIG_SECURE_BOOT_INSECURE CONFIG_SECURE_FLASH_ENCRYPTION_MODE_DEVELOPMENT \
                     CONFIG_SECURE_INSECURE_ALLOW_DL_MODE; do
            if grep -q "^$opt=y" "$cfg"; then echo "production profile must not set $opt"; exit 1; fi
          done

  deploy:
    name: Deploy artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose (all profiles)
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml --profile supabase-sync config --quiet
          docker compose -f deploy/docker-compose.yml --profile observability config --quiet
      - name: Build images
        if: github.event_name == 'push'
        run: |
          docker build -f server/Dockerfile -t talos-hub .
          docker build -f connectors/supabase_sync/Dockerfile -t talos-supabase-sync .
      - name: Hub container smoke test
        if: github.event_name == 'push'
        run: |
          docker run -d --name hub -p 127.0.0.1:8080:8080 -e TALOS_ALLOW_DEV_ON_NETWORK=1 talos-hub
          for i in $(seq 1 30); do curl -fsS localhost:8080/v1/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/state)" = 401
          docker logs hub
