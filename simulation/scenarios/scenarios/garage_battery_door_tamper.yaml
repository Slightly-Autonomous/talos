name: garage_battery_door_tamper
description: >-
  TL-SN-002's tool-free battery door (owner 2026-11-22, HD-049). Armed away, someone opens node_garage's battery door: the node reports tamper.battery_door (not the enclosure lid), the same 24-hour tamper rule notifies the owner, and closing it is recorded. The lid never reads open. Disarmed, a second opening still alarms.
site: sites/garage_driveway.yaml
seed: 42
start_unix_ms: 1794740400000
duration_ms: 40000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
rules:
  - id: enclosure_tamper_alarm
    revision: 1
    property_id: garage-01
    principal_id: "rule:enclosure_tamper_alarm"
    enabled: true
    # Tamper is a 24-hour condition (ADR 0007 amendment): no armed_modes. Any tamper cause.
    trigger_event_type: tamper.opened
    actions:
      - operation: notify
        target: {device_id: notifier, capability_id: notify}
        args: {notify: {recipient_role: owner, text: "Tamper: node_garage"}}
        ttl_ms: 5000
        verification: VERIFICATION_MODE_ACK_ONLY
        verification_window_ms: 3000
stimuli:
  - {at_ms: 0, arm_mode_set: {principal_id: owner, mode: ARM_MODE_ARMED_AWAY}}
  - {at_ms: 5000, battery_door_set: {device_id: node_garage, open: true}}
  - {at_ms: 15000, battery_door_set: {device_id: node_garage, open: false}}
  - {at_ms: 20000, arm_mode_set: {principal_id: owner, mode: ARM_MODE_DISARMED}}
  - {at_ms: 25000, battery_door_set: {device_id: node_garage, open: true}}
  - {at_ms: 30000, battery_door_set: {device_id: node_garage, open: false}}
expect:
  - name: boot state of the door
    observation: {event_type: tamper.state, device_id: node_garage, capability_id: tamper.battery_door, to_ms: 1000, min_count: 1, max_count: 1}
  - name: door opened while armed
    observation: {event_type: tamper.opened, device_id: node_garage, capability_id: tamper.battery_door, from_ms: 5000, to_ms: 6000, min_count: 1, max_count: 1}
  - name: door closed
    observation: {event_type: tamper.closed, device_id: node_garage, capability_id: tamper.battery_door, from_ms: 15000, to_ms: 16000, min_count: 1, max_count: 1}
  - name: door opened while disarmed
    observation: {event_type: tamper.opened, device_id: node_garage, capability_id: tamper.battery_door, from_ms: 25000, to_ms: 26000, min_count: 1, max_count: 1}
  - name: the lid never reads open
    observation: {event_type: tamper.opened, device_id: node_garage, capability_id: tamper.enclosure, min_count: 0, max_count: 0}
  - name: alarmed both times, in every mode
    command: {operation: notify, final_status_in: [COMMAND_STATUS_COMPLETED_UNVERIFIED], count: 2}
  - name: one notification per opening
    physical_effects: {device_id: notifier, count: 2}
