name: lock_front_door_verified
description: >-
  The owner locks the front door. The lock bolts, the portal is locked in ground truth, and the reported lock state verifies the command.
site: sites/suburban_home.yaml
seed: 42
start_unix_ms: 1794736800000
duration_ms: 30000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
stimuli:
  - at_ms: 5000
    user_command:
      command_id: lock-1
      principal_id: owner
      operation: access.set_locked
      target: {device_id: front_lock, capability_id: access.lock}
      args: {set_locked: {locked: true}}
      ttl_ms: 5000
      verification_window_ms: 4000
      expect: {source: {device_id: front_lock, capability_id: access.lock}, payload: {lock: {locked: true}}}
expect:
  - name: lock verified
    command: {operation: access.set_locked, final_status_in: [COMMAND_STATUS_VERIFIED], count: 1}
  - name: door locked in reality
    portal: {portal_id: front_door, locked: true}
  - name: bolt moved once
    physical_effects: {device_id: front_lock, count: 1}
