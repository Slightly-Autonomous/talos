name: studio_entry_door_armed_home
description: >-
  Studio armed_home; the entry door opens and the speaker announces it.
site: sites/studio_apartment.yaml
seed: 42
start_unix_ms: 1794733200000
duration_ms: 30000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
rules:
  - id: entry_chime
    revision: 1
    property_id: studio-01
    principal_id: "rule:entry_chime"
    enabled: true
    trigger_event_type: contact.opened
    trigger_zone_id: studio
    armed_modes: [ARM_MODE_ARMED_HOME, ARM_MODE_ARMED_AWAY]
    actions:
      - operation: audio.speak
        target: {device_id: studio_speaker, capability_id: audio.speak}
        args: {audio_speak: {text: "Entry door opened.", volume_percent: 65}}
        ttl_ms: 5000
        verification_window_ms: 3000
        expect: {source: {device_id: studio_speaker, capability_id: audio.speak}, payload: {audio_playback: {playing: true}}}
stimuli:
  - {at_ms: 0, arm_mode_set: {principal_id: owner, mode: ARM_MODE_ARMED_HOME}}
  - {at_ms: 3000, portal_set: {portal_id: entry_door, open: true}}
expect:
  - name: chime verified
    command: {operation: audio.speak, target_device_id: studio_speaker, final_status_in: [COMMAND_STATUS_VERIFIED], count: 1}
  - name: chime played once
    physical_effects: {device_id: studio_speaker, count: 1}
