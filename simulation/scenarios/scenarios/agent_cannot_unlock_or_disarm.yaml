name: agent_cannot_unlock_or_disarm
description: >-
  An AI agent with a full grant still cannot unlock (security-critical) or disarm (human-only).
site: sites/suburban_home.yaml
seed: 42
start_unix_ms: 1794736800000
duration_ms: 30000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
  - {id: agent-1, kind: PRINCIPAL_KIND_AGENT, max_risk: RISK_CLASS_SECURITY_CRITICAL}
stimuli:
  - {at_ms: 0, arm_mode_set: {principal_id: owner, mode: ARM_MODE_ARMED_AWAY}}
  - {at_ms: 1000, actor_enter: {actor: owner_phone, kind: ACTOR_KIND_PERSON, position: {x: 6, y: -5}, speed_mps: 0}}
  - {at_ms: 2000, arm_mode_set: {principal_id: agent-1, mode: ARM_MODE_DISARMED}}
  - at_ms: 3000
    user_command:
      command_id: agent-unlock
      principal_id: agent-1
      operation: access.set_locked
      target: {device_id: front_lock, capability_id: access.lock}
      args: {set_locked: {locked: false}}
      ttl_ms: 5000
      verification_window_ms: 4000
      expect: {source: {device_id: front_lock, capability_id: access.lock}, payload: {lock: {locked: false}}}
expect:
  - name: unlock denied
    command: {operation: access.set_locked, final_status_in: [COMMAND_STATUS_DENIED], count: 1}
  - name: lock untouched
    physical_effects: {device_id: front_lock, count: 0}
  - name: still armed
    arm_mode: {mode: ARM_MODE_ARMED_AWAY}
