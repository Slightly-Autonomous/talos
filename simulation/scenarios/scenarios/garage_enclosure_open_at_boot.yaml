name: garage_enclosure_open_at_boot
description: >-
  node_garage starts with its lid already off: the boot state report says so (tamper.state, open), which the hub records and shows; it is a state, not an opening, so the tamper rule does not fire. Putting the lid back is a tamper.closed.
site: sites/garage_driveway_lid_off.yaml
seed: 42
start_unix_ms: 1794740400000
duration_ms: 20000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
rules:
  - id: enclosure_tamper_alarm
    revision: 1
    property_id: garage-01
    principal_id: "rule:enclosure_tamper_alarm"
    enabled: true
    # Tamper is a 24-hour condition (ADR 0007 amendment): no armed_modes.
    trigger_event_type: tamper.opened
    actions:
      - operation: notify
        target: {device_id: notifier, capability_id: notify}
        args: {notify: {recipient_role: owner, text: "Tamper: node_garage enclosure opened"}}
        ttl_ms: 5000
        verification: VERIFICATION_MODE_ACK_ONLY
        verification_window_ms: 3000
stimuli:
  - {at_ms: 0, arm_mode_set: {principal_id: owner, mode: ARM_MODE_ARMED_AWAY}}
  - {at_ms: 10000, enclosure_set: {device_id: node_garage, open: false}}
expect:
  - name: state reported at boot
    observation: {event_type: tamper.state, device_id: node_garage, to_ms: 1000, min_count: 1, max_count: 1}
  - name: no opening transition
    observation: {event_type: tamper.opened, device_id: node_garage, min_count: 0, max_count: 0}
  - name: lid put back
    observation: {event_type: tamper.closed, device_id: node_garage, from_ms: 10000, to_ms: 11000, min_count: 1, max_count: 1}
  - name: no alarm for a state report
    command: {operation: notify, count: 0}
