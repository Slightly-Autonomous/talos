name: lock_jammed
description: >-
  The lock acknowledges but jams. Its reported state stays unlocked, so the command ends completed_unverified and the door is not locked.
site: sites/suburban_home.yaml
seed: 42
start_unix_ms: 1794736800000
duration_ms: 30000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
stimuli:
  - {at_ms: 0, actuator_fault: {device_id: front_lock, fault: ACTUATOR_FAULT_JAM}}
  - at_ms: 5000
    user_command:
      command_id: lock-1
      principal_id: owner
      operation: access.set_locked
      target: {device_id: front_lock, capability_id: access.lock}
      args: {set_locked: {locked: true}}
      ttl_ms: 5000
      verification_window_ms: 4000
      expect: {source: {device_id: front_lock, capability_id: access.lock}, payload: {lock: {locked: true}}}
expect:
  - name: not verified
    command: {operation: access.set_locked, final_status_in: [COMMAND_STATUS_COMPLETED_UNVERIFIED], count: 1}
  - name: door not locked
    portal: {portal_id: front_door, locked: false}
