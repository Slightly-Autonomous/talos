name: device_reboot_mid_scenario
description: >-
  The front node reboots: its boot epoch increments and sequence numbers restart. Post-reboot events are accepted, not mistaken for duplicates.
site: sites/suburban_home.yaml
seed: 42
start_unix_ms: 1794736800000
duration_ms: 30000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
stimuli:
  - {at_ms: 5000, device_reboot: {device_id: node_front}}
  - {at_ms: 8000, portal_set: {portal_id: front_door, open: true}}
expect:
  - name: post-reboot open accepted
    observation: {event_type: contact.opened, device_id: node_front, from_ms: 8000, min_count: 1, max_count: 1}
  - name: belief is open
    capability_state: {ref: {device_id: node_front, slot: 0, capability_id: contact.open_state}, payload: {contact: {open: true}}}
