name: garage_side_door_intrusion
description: >-
  Armed away: someone crosses the driveway, opens the garage side door and walks in. The owner is notified (ack-only, so completed_unverified is the best possible outcome).
site: sites/garage_driveway.yaml
seed: 42
start_unix_ms: 1794740400000
duration_ms: 30000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
rules:
  - id: garage_door_notify
    revision: 1
    property_id: garage-01
    principal_id: "rule:garage_door_notify"
    enabled: true
    trigger_event_type: contact.opened
    trigger_zone_id: garage
    armed_modes: [ARM_MODE_ARMED_AWAY]
    actions:
      - operation: notify
        target: {device_id: notifier, capability_id: notify}
        args: {notify: {recipient_role: owner, text: "Garage side door opened"}}
        ttl_ms: 5000
        verification: VERIFICATION_MODE_ACK_ONLY
        verification_window_ms: 3000
stimuli:
  - {at_ms: 0, arm_mode_set: {principal_id: owner, mode: ARM_MODE_ARMED_AWAY}}
  - {at_ms: 1000, actor_enter: {actor: intruder, kind: ACTOR_KIND_PERSON, position: {x: 7, y: 1}, speed_mps: 1.3}}
  - {at_ms: 1000, actor_move: {actor: intruder, path: [{x: 12, y: 7}, {x: 12, y: 10.7}]}}
  - {at_ms: 7000, portal_set: {portal_id: side_door, open: true}}
  - {at_ms: 7500, actor_move: {actor: intruder, path: [{x: 8, y: 10.7}, {x: 5, y: 13}]}}
expect:
  - name: driveway motion
    observation: {event_type: motion.detected, device_id: node_driveway}
  - name: door opened
    observation: {event_type: contact.opened, device_id: node_garage, min_count: 1, max_count: 1}
  - name: garage motion
    observation: {event_type: motion.detected, device_id: node_garage, from_ms: 7000}
  - name: owner notified, unverified by design
    command: {operation: notify, final_status_in: [COMMAND_STATUS_COMPLETED_UNVERIFIED], count: 1}
  - name: notification delivered once
    physical_effects: {device_id: notifier, count: 1}
