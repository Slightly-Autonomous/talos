name: garage_driveway_camera_detection
description: >-
  A person walks up the driveway in daylight: the driveway camera reports a person detection.
site: sites/garage_driveway.yaml
seed: 42
start_unix_ms: 1794772800000
duration_ms: 30000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
stimuli:
  - {at_ms: 1000, actor_enter: {actor: visitor, kind: ACTOR_KIND_PERSON, position: {x: 7, y: 0.5}, speed_mps: 1.0}}
  - {at_ms: 1000, actor_move: {actor: visitor, path: [{x: 7, y: 6}]}}
expect:
  - name: person detected
    observation: {event_type: camera.object_detected, device_id: cam_driveway}
