name: garage_usb_console_attack
description: >-
  node_garage is a TL-SN-002 whose USB-C port stays reachable from outside the closed enclosure (owner,
  2026-11-22). Armed away, someone plugs a laptop into it and tries to switch the PIR rail off, re-provision
  the node and reboot it. With the lid closed the console is read-only: every line is refused, nothing
  changes, and the node reports the refusals to the hub as one rate-limited "console.locked" diagnostic
  (observability plane, no alarm, no journal entry). Then the intruder opens the lid to get at the board:
  tamper.opened alarms through the 24-hour tamper rule, and only now would the console take commands.
site: sites/garage_driveway.yaml
seed: 42
start_unix_ms: 1794740400000
duration_ms: 30000
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
rules:
  - id: enclosure_tamper_alarm
    revision: 1
    property_id: garage-01
    principal_id: "rule:enclosure_tamper_alarm"
    enabled: true
    trigger_event_type: tamper.opened
    actions:
      - operation: notify
        target: {device_id: notifier, capability_id: notify}
        args: {notify: {recipient_role: owner, text: "Tamper: node_garage enclosure opened"}}
        ttl_ms: 5000
        verification: VERIFICATION_MODE_ACK_ONLY
        verification_window_ms: 3000
stimuli:
  - {at_ms: 0, arm_mode_set: {principal_id: owner, mode: ARM_MODE_ARMED_AWAY}}
  - {at_ms: 5000, usb_console: {device_id: node_garage, line: "rail 2 aon off"}}
  - {at_ms: 5200, usb_console: {device_id: node_garage, line: "provision intruder 00112233445566778899aabbccddeeff"}}
  - {at_ms: 5400, usb_console: {device_id: node_garage, line: "reboot"}}
  - {at_ms: 5600, usb_console: {device_id: node_garage, line: "id"}}  # read-only: answered, not counted
  - {at_ms: 15000, enclosure_set: {device_id: node_garage, open: true}}
  - {at_ms: 16000, usb_console: {device_id: node_garage, line: "led service on"}}  # lid open: accepted
expect:
  - name: the first refusal is reported at once
    diagnostic: {device_id: node_garage, kind: console.locked, from_ms: 5000, to_ms: 5600, min_count: 1, max_count: 1}
  - name: the next two wait for the 60 s window (rate limit), so one report in this run
    diagnostic: {device_id: node_garage, kind: console.locked, to_ms: 30000, min_count: 1, max_count: 1}
  - name: the attempts raise no tamper alarm while the lid stays closed
    observation: {event_type: tamper.opened, device_id: node_garage, to_ms: 14900, min_count: 0, max_count: 0}
  - name: the refused reboot did not happen (no new boot state report)
    observation: {event_type: tamper.state, device_id: node_garage, from_ms: 1000, to_ms: 30000, min_count: 0, max_count: 0}
  - name: opening the lid is the alarm
    observation: {event_type: tamper.opened, device_id: node_garage, from_ms: 15000, to_ms: 16000, min_count: 1, max_count: 1}
  - name: the owner is notified once, for the lid
    command: {operation: notify, final_status_in: [COMMAND_STATUS_COMPLETED_UNVERIFIED], count: 1}
  - name: one notification
    physical_effects: {device_id: notifier, count: 1}
