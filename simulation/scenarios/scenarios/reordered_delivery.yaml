name: reordered_delivery
description: >-
  Up to 1.5 s of jitter on the front node reorders rapid door transitions. Late events are journaled but never regress belief: the final state is closed.
site: sites/suburban_home.yaml
seed: 7
start_unix_ms: 1794736800000
duration_ms: 30000
links:
  - {device_id: node_front, latency_ms: 50, jitter_ms: 1500}
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL}
stimuli:
  - {at_ms: 1000, portal_set: {portal_id: front_door, open: true}}
  - {at_ms: 1100, portal_set: {portal_id: front_door, open: false}}
  - {at_ms: 1200, portal_set: {portal_id: front_door, open: true}}
  - {at_ms: 1300, portal_set: {portal_id: front_door, open: false}}
expect:
  - name: all transitions journaled
    observation: {event_type: contact.opened, device_id: node_front, min_count: 2, max_count: 2}
  - name: belief is closed
    capability_state: {ref: {device_id: node_front, slot: 0, capability_id: contact.open_state}, payload: {contact: {open: false}}}
