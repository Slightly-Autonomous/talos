# Local Talos stack. From the repository root:
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml --profile supabase-sync up --build
#   docker compose -f deploy/docker-compose.yml --profile vision up frigate   (deploy/frigate/README.md)
# Copy deploy/.env.example to deploy/.env for the Supabase profile.
name: talos

services:
  hub:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      TALOS_CONFIG: ${TALOS_CONFIG:-/etc/talos/deploy/config/hub.dev.yaml}
      # Dev config only: allowed because the port below is bound to localhost.
      TALOS_ALLOW_DEV_ON_NETWORK: "1"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5683:5683/udp"
    volumes:
      - talos-data:/data
    restart: unless-stopped

  supabase-sync:
    profiles: ["supabase-sync"]
    build:
      context: ..
      dockerfile: connectors/supabase_sync/Dockerfile
    environment:
      HUB_URL: http://hub:8080
      HUB_TOKEN: ${TALOS_SYNC_TOKEN:-dev-sync-token}
      PROPERTY_ID: ${TALOS_PROPERTY_ID:-house-01}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-5000}
    depends_on:
      - hub
    restart: unless-stopped

  # Optional engineering observability (read-only; never in the alarm path).
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - hub

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # Camera recorder and detection (ADR 0020). Its internal API (5000) has no
  # authentication: bound to localhost here, and reached by the hub through
  # its media proxy (media.frigate_url / TALOS_FRIGATE_URL).
  frigate:
    profiles: ["vision"]
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    shm_size: "256mb"
    environment:
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:-dev-rtsp-password}
    volumes:
      - ./frigate/config:/config
      - frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "127.0.0.1:5000:5000"   # internal API, unauthenticated
      - "127.0.0.1:8971:8971"   # web UI with login
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  talos-data:
  frigate-media:
