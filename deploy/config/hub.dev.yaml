# Development hub config. DEV TOKENS ONLY: the raw tokens are documented in
# deploy/README.md. Generate real ones with: talos_hub hash-token <random-token>
role: HUB_ROLE_HUB
dev_mode: true
listen_host: 127.0.0.1
port: 8080
storage:
  driver: STORAGE_DRIVER_SQLITE
  sqlite_path: ../../.data/talos-journal.db   # override with TALOS_SQLITE_PATH
sync:
  target: SYNC_TARGET_NONE   # SYNC_TARGET_SUPABASE + run connectors/supabase_sync
  supabase_url_env: SUPABASE_URL
  supabase_service_key_env: SUPABASE_SERVICE_ROLE_KEY
auth: AUTH_MODE_LOCAL
property_file: ../../contracts/manifests/properties/sample_backyard.yaml
freshness_max_age_ms: 900000
utc_offset_minutes: -480
tick_interval_ms: 250
cors_origins: ["http://localhost:5173", "http://localhost:4173"]
# Camera media through the hub (ADR 0020): Frigate's internal API on this machine
# (docker compose --profile vision). Override with TALOS_FRIGATE_URL.
media:
  frigate_url: http://127.0.0.1:5000
# CoAP/UDP device ingress for Thread nodes (ADR 0014). Dev keys only.
coap:
  enabled: true
  port: 5683
  device_keys_file: dev-device-keys.yaml
  rate_per_second: 20
  burst: 40
principals:
  - {id: owner, kind: PRINCIPAL_KIND_HUMAN, max_risk: RISK_CLASS_SECURITY_CRITICAL, token_sha256: 8ac4afa44f3f01da2d47daaee53270af09cdf9b0482481377b750332904ddd94}
  # AI assistants via connectors/mcp_server: an AGENT principal, so policy
  # caps it at disruptive outputs and never allows unlock/disarm.
  - {id: mcp-agent, kind: PRINCIPAL_KIND_AGENT, max_risk: RISK_CLASS_DISRUPTIVE_OUTPUT, token_sha256: d967787d3023c82861961e4fb7acaacf48d1175fa1873b4b679bec86c69afd7c}
  - {id: metrics, kind: PRINCIPAL_KIND_SYSTEM, max_risk: RISK_CLASS_INFORMATIONAL, token_sha256: a069201469e8a354bbd72208f9377a2f6c78d76b83a8fde56e763072dc7f42d8}
  - {id: sync-worker, kind: PRINCIPAL_KIND_SYSTEM, max_risk: RISK_CLASS_INFORMATIONAL, token_sha256: a5272572495630914856ca946d2c9868fb9cfce8fc1a674e411989cdd4c5a1bc}
devices:
  - {device_id: node-07, token_sha256: 3a0c053a94f5d03270628729fd2f84ba52065698f1b95719409e93042df778a3}
  - {device_id: node-12, token_sha256: 65060935b3f93197b2100a6d3137aefa655a8961fe06f9dbade7a5bc86cb988f}
  - {device_id: patio_speaker, token_sha256: d53ebf5b31fe00c0381b5ec2dcd95a1981018ddde6064236be8eed5720fb720d}
  - {device_id: lock-3, token_sha256: dd63e701464b4a0530f6b22693a920496c64086aab7ff8f045db279a1b28948f}
  # TL-VN-001 Vision Node agent, and Frigate's view of the same camera (ADR 0020).
  - {device_id: cam_patio, token_sha256: 30f448eda1759a0c265edfe03bea47e42d4b73753f693f3c737e67c11dfa3420}
  - {device_id: cam_patio_video, token_sha256: bfae4ba55bbccd3d2b38105845c555673eadbd58933a70d0a954351779f9d407}
rules:
  - id: backyard_motion_warning
    revision: 1
    property_id: house-01
    principal_id: "rule:backyard_motion_warning"
    enabled: true
    trigger_event_type: motion.detected
    trigger_zone_id: backyard
    armed_modes: [ARM_MODE_ARMED_AWAY]
    # No schedule in dev so the demo and browser E2E work at any hour; the twin
    # covers schedule behavior (backyard_motion_daytime scenario).
    actions:
      - operation: audio.speak
        target: {device_id: patio_speaker, capability_id: audio.speak}
        args: {audio_speak: {text: "This property is monitored.", volume_percent: 65}}
        ttl_ms: 5000
        verification_window_ms: 3000
        expect: {source: {device_id: patio_speaker, capability_id: audio.speak}, payload: {audio_playback: {playing: true}}}
  # Enclosure tamper is a 24-hour condition (ADR 0007 amendment): no armed_modes,
  # so it alarms in every mode, disarmed included.
  - id: enclosure_tamper_alarm
    revision: 1
    property_id: house-01
    principal_id: "rule:enclosure_tamper_alarm"
    enabled: true
    trigger_event_type: tamper.opened
    actions:
      - operation: audio.speak
        target: {device_id: patio_speaker, capability_id: audio.speak}
        args: {audio_speak: {text: "Tamper alarm. A sensor enclosure was opened.", volume_percent: 80}}
        ttl_ms: 5000
        verification_window_ms: 3000
        expect: {source: {device_id: patio_speaker, capability_id: audio.speak}, payload: {audio_playback: {playing: true}}}
  # Mark the camera's footage when someone is in the backyard while armed (ADR 0020).
  # Verified only when Frigate has the clip (bookmark 30 s, then Frigate closes it).
  - id: backyard_motion_bookmark
    revision: 1
    property_id: house-01
    principal_id: "rule:backyard_motion_bookmark"
    enabled: true
    trigger_event_type: motion.detected
    trigger_zone_id: backyard
    armed_modes: [ARM_MODE_ARMED_AWAY]
    actions:
      - operation: camera.bookmark
        target: {device_id: cam_patio_video, capability_id: camera.recording}
        args: {bookmark: {duration_s: 30, label: talos}}
        ttl_ms: 10000
        verification_window_ms: 180000
