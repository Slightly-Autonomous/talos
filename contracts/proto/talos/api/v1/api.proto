syntax = "proto3";

package talos.api.v1;

import "talos/server/v1/config.proto";
import "talos/v1/command.proto";
import "talos/v1/common.proto";
import "talos/v1/firmware.proto";
import "talos/v1/health.proto";
import "talos/v1/journal.proto";
import "talos/v1/observation.proto";
import "talos/v1/rule.proto";

// Hub HTTP API v1 (ADR 0010). JSON over HTTP using the protobuf JSON mapping;
// the same contract is served by a local hub or a cloud-hosted one.

enum Freshness {
  FRESHNESS_UNSPECIFIED = 0;
  FRESHNESS_UNKNOWN = 1;
  FRESHNESS_FRESH = 2;
  FRESHNESS_STALE = 3;
}

enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  COMMAND_OUTCOME_PENDING = 1;
  // The only success.
  COMMAND_OUTCOME_VERIFIED = 2;
  COMMAND_OUTCOME_UNVERIFIED = 3;
  COMMAND_OUTCOME_FAILED = 4;
  COMMAND_OUTCOME_UNKNOWN = 5;
}

message HealthResponse {
  string status = 1;
  string version = 2;
  string role = 3;
  uint64 journal_seq = 4;
  string property_id = 5;
}

message CapabilityView {
  talos.v1.CapabilityRef ref = 1;
  talos.v1.ObservationPayload value = 2;
  string event_type = 3;
  string last_event_id = 4;
  int64 received_at_unix_ms = 5;
  optional int64 observed_at_unix_ms = 6;
  Freshness freshness = 7;
  uint64 journal_seq = 8;
}

message CommandView {
  talos.v1.Command command = 1;
  talos.v1.CommandStatus status = 2;
  CommandOutcome outcome = 3;
  optional int64 dispatched_at_unix_ms = 4;
  repeated talos.v1.CommandTransition history = 5;
}

// A node in maintenance: its tamper alarm is suppressed until until_unix_ms.
message DeviceMaintenance {
  string device_id = 1;
  int64 until_unix_ms = 2;
  string principal_id = 3;
}

message StateResponse {
  string property_id = 1;
  uint64 through_seq = 2;
  talos.v1.ArmMode arm_mode = 3;
  repeated CapabilityView capabilities = 4;
  repeated CommandView commands = 5;
  int64 server_time_unix_ms = 6;
  repeated DeviceMaintenance maintenance = 7;
}

message JournalPage {
  repeated talos.v1.JournalEntry entries = 1;
  // Pass as `after` to continue.
  uint64 next_after = 2;
  bool has_more = 3;
}

message SetArmModeRequest {
  talos.v1.ArmMode mode = 1;
}

message SetArmModeResponse {
  talos.v1.ArmMode mode = 1;
}

// The principal comes from authentication, and created/expiry times from the
// hub clock; clients never set them.
message CommandRequest {
  string command_id = 1;
  string idempotency_key = 2;
  string operation = 3;
  talos.v1.CapabilityRef target = 4;
  talos.v1.CommandArgs args = 5;
  uint32 ttl_ms = 6;
  uint32 verification_window_ms = 7;
  optional talos.v1.ExpectedObservation expect = 8;
}

message CommandResponse {
  string command_id = 1;
  bool duplicate = 2;
  talos.v1.CommandStatus status = 3;
  string reason = 4;
}

message IngestResponse {
  // "accepted", "duplicate", "too_old" or "rejected".
  string status = 1;
  optional uint64 journal_seq = 2;
  string error_code = 3;
  string error_message = 4;
}

message PendingCommands {
  repeated talos.v1.Command commands = 1;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}

message ConfigResponse {
  uint32 revision = 1;
  talos.server.v1.ConfigDocument document = 2;
  int64 created_at_unix_ms = 3;
  string principal_id = 4;
  string sha256 = 5;
}

// Optimistic concurrency: base_revision must equal the current revision.
message PutConfigRequest {
  uint32 base_revision = 1;
  talos.server.v1.ConfigDocument document = 2;
}

message RulePreviewRequest {
  talos.v1.Rule rule = 1;
  int64 from_unix_ms = 2;
  int64 to_unix_ms = 3;
}

message RulePreviewMatch {
  uint64 journal_seq = 1;
  int64 received_at_unix_ms = 2;
  string event_id = 3;
  string event_type = 4;
  string device_id = 5;
}

message RulePreviewResponse {
  repeated RulePreviewMatch matches = 1;
  uint32 evaluated_observations = 2;
}

message HealthListResponse {
  repeated talos.v1.Health devices = 1;
}

message DiagnosticsResponse {
  repeated talos.v1.Diagnostic diagnostics = 1;
}

// Desired runtime configuration for a node (delivered on its next contact).
message DeviceConfigRequest {
  uint32 heartbeat_interval_ms = 1;
  uint32 environment_interval_ms = 2;
  uint32 impact_threshold_mg = 3;
}

message DeviceConfigResponse {
  string device_id = 1;
  uint32 desired_revision = 2;
  uint32 applied_revision = 3;
}

// image is base64 in the JSON mapping.
message FirmwareImportRequest {
  talos.v1.FirmwareRelease manifest = 1;
  bytes image = 2;
}

message FirmwareReleaseList {
  repeated talos.v1.FirmwareRelease releases = 1;
}

message CampaignRequest {
  string device_id = 1;
  uint32 version = 2;
}

message CampaignResponse {
  string device_id = 1;
  uint32 version = 2;
  // "scheduled", "offered", "downloading", "pending_verify", "done", "failed", "rolled_back"
  string state = 3;
}
