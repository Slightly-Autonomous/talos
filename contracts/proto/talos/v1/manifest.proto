syntax = "proto3";

package talos.v1;

// Board and module manifests (spec §31-32). All numbers are PROVISIONAL until
// measured on hardware; `provisional` must stay true until then.

enum PowerSource {
  POWER_SOURCE_UNSPECIFIED = 0;
  POWER_SOURCE_BATTERY_ONLY = 1;
  POWER_SOURCE_USB = 2;
  POWER_SOURCE_SOLAR_BATTERY = 3;
}

message PowerSourceBudget {
  PowerSource source = 1;
  uint32 sustained_mw = 2;
  uint32 peak_mw = 3;
}

message RailSpec {
  string name = 1;
  uint32 voltage_mv = 2;
  uint32 max_ma = 3;
  uint32 per_slot_max_ma = 4;
}

message SlotSpec {
  uint32 index = 1;
  bool wake = 2;
  optional uint32 i2c_branch = 3;
  bool spi = 4;
  bool uart = 5;
  bool analog = 6;
  repeated string rails = 7;
}

message BoardManifest {
  string id = 1;
  string revision = 2;
  bool provisional = 3;
  repeated SlotSpec slots = 4;
  repeated RailSpec rails = 5;
  repeated PowerSourceBudget power_sources = 6;
  // Free-form notes on what is unverified.
  repeated string notes = 7;
}

message RailLoad {
  string rail = 1;
  uint32 active_ma = 2;
}

message ModuleManifest {
  string id = 1;
  string revision = 2;
  bool provisional = 3;
  bool needs_wake = 4;
  // 7-bit addresses.
  repeated uint32 i2c_addresses = 5;
  bool needs_spi = 6;
  bool needs_uart = 7;
  bool needs_analog = 8;
  repeated RailLoad loads = 9;
  uint32 average_mw = 10;
  uint32 peak_mw = 11;
  repeated string capabilities = 12;
  repeated string notes = 13;
}
