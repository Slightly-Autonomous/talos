syntax = "proto3";

package talos.v1;

// Board and module manifests (spec §31-32). All numbers are PROVISIONAL until
// measured on hardware; `provisional` must stay true until then.

enum PowerSource {
  POWER_SOURCE_UNSPECIFIED = 0;
  POWER_SOURCE_BATTERY_ONLY = 1;
  POWER_SOURCE_USB = 2;
  POWER_SOURCE_SOLAR_BATTERY = 3;
  // 802.3af Power over Ethernet (TL-VN-001).
  POWER_SOURCE_POE = 4;
}

message PowerSourceBudget {
  PowerSource source = 1;
  uint32 sustained_mw = 2;
  uint32 peak_mw = 3;
  // Finer-grained sustained budget for sleepy nodes. When non-zero it is used
  // instead of sustained_mw.
  uint32 sustained_uw = 4;
}

message RailSpec {
  string name = 1;
  uint32 voltage_mv = 2;
  uint32 max_ma = 3;
  uint32 per_slot_max_ma = 4;
}

message SlotSpec {
  uint32 index = 1;
  bool wake = 2;
  optional uint32 i2c_branch = 3;
  bool spi = 4;
  bool uart = 5;
  bool analog = 6;
  repeated string rails = 7;
  // Built-in module (ADR 0019, TL-SN-002): the module id (a ModuleManifest)
  // soldered on the board for this slot. Empty = a card slot. A built-in slot is
  // always populated with exactly this module; connector, per-slot rail and mux
  // branch checks do not apply to it, its I2C devices sit on the root bus.
  string built_in_module = 8;
}

// The board's battery (ADR 0019). Thresholds are cell-pack voltages, under
// load for primary cells. PROVISIONAL like every manifest number.
message BatterySpec {
  string chemistry = 1;  // e.g. "li-fes2" (AA lithium primary), "li-ion"
  string form = 2;       // e.g. "AA", "18650"
  uint32 cells_in_series = 3;
  // false = primary: the board must never charge it.
  bool rechargeable = 4;
  uint32 fresh_mv = 5;
  uint32 low_mv = 6;
  uint32 critical_mv = 7;
}

// One pin of an on-board I/O expander (PROVISIONAL until the board is built).
message ExpanderPinSpec {
  // "P00".."P07", "P10".."P17".
  string pin = 1;
  // Schematic net, e.g. "SLOT_LED0_N", "TAMPER_N". Empty for unconnected pins.
  string net = 2;
  // "input", "output", or "unused" (no connection; firmware drives it low).
  string direction = 3;
  bool active_low = 4;
}

// An I/O expander on the root bus.
message ExpanderSpec {
  string name = 1;  // e.g. "EXP_C"
  string part = 2;  // e.g. "TCA9535"
  uint32 i2c_address = 3;
  string interrupt_net = 4;  // e.g. "EXP_INT_N" (wired-OR)
  repeated ExpanderPinSpec pins = 5;
}

// A deep-sleep wake source at the MCU.
message WakeLineSpec {
  string net = 1;       // e.g. "EXP_WAKE"
  string mcu_pin = 2;   // e.g. "GPIO14"; mirrors the firmware BoardSupport table
  bool active_high = 3;
  string note = 4;
}

// An indicator LED.
message IndicatorSpec {
  string name = 1;    // silk label, e.g. "STAT", "S0", "PWR"
  string net = 2;
  string driver = 3;  // what drives it: "GPIO8", "EXP_C P00", "hardware"
  bool active_low = 4;
  string color = 5;
}

// A module only some slots of this board may host (e.g. a T/RH card kept away
// from the charger's heat, B-03). PROVISIONAL like every manifest number.
message ModuleSlotLimit {
  string module_id = 1;
  repeated uint32 allowed_slots = 2;
  string reason = 3;
}

message BoardManifest {
  string id = 1;
  string revision = 2;
  bool provisional = 3;
  repeated SlotSpec slots = 4;
  repeated RailSpec rails = 5;
  repeated PowerSourceBudget power_sources = 6;
  // Free-form notes on what is unverified.
  repeated string notes = 7;
  // Slot connector standard, e.g. "sensor_edge_v1". Empty = not declared.
  string connector_standard = 8;
  // Number of card UARTs usable at the same time. 0 = not declared (no check).
  uint32 uart_channels = 9;
  // 7-bit root-bus addresses taken by the board; mux branches join the root
  // bus when enabled, so cards must not reuse them.
  repeated uint32 reserved_i2c_addresses = 10;
  // Board family (e.g. "TL-SN-001") and node transport ("thread", "ip").
  string board_family = 11;
  string transport = 12;
  // On-board I/O expanders, deep-sleep wake lines and indicators. Documentation
  // of the provisional wiring; firmware's BoardSupport table must agree.
  repeated ExpanderSpec expanders = 13;
  repeated WakeLineSpec wake_lines = 14;
  repeated IndicatorSpec indicators = 15;
  // Capabilities of the board itself, independent of slots (e.g.
  // "tamper.enclosure" for the lid loop). Devices may declare them.
  repeated string board_capabilities = 16;
  repeated ModuleSlotLimit module_slot_limits = 17;
  // The battery, if the board has one (ADR 0019). Unset = not declared.
  optional BatterySpec battery = 18;
}

message RailLoad {
  string rail = 1;
  uint32 active_ma = 2;
}

message ModuleManifest {
  string id = 1;
  string revision = 2;
  bool provisional = 3;
  bool needs_wake = 4;
  // 7-bit addresses.
  repeated uint32 i2c_addresses = 5;
  bool needs_spi = 6;
  bool needs_uart = 7;
  bool needs_analog = 8;
  repeated RailLoad loads = 9;
  uint32 average_mw = 10;
  uint32 peak_mw = 11;
  repeated string capabilities = 12;
  repeated string notes = 13;
  // Connector standard the card is built for. Empty = not declared.
  string connector_standard = 14;
  // Finer-grained average draw; used instead of average_mw when non-zero.
  uint32 average_uw = 15;
  // Bench test fixture (TL-TEST-001). The firmware time-shares the muxed UART
  // across fixtures one slot at a time, so they are exempt from the concurrent
  // UART limit. Never set on a field module.
  bool test_fixture = 16;
}
