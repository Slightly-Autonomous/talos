syntax = "proto3";

package talos.v1;

import "talos/v1/command.proto";
import "talos/v1/observation.proto";
import "talos/v1/rule.proto";

// Relation of an observation's source position to what the hub had seen.
enum SourceOrder {
  SOURCE_ORDER_UNSPECIFIED = 0;
  SOURCE_ORDER_IN_ORDER = 1;
  SOURCE_ORDER_GAP = 2;
  SOURCE_ORDER_LATE = 3;
  SOURCE_ORDER_NEW_BOOT = 4;
}

message ObservationRecorded {
  ObservationEnvelope envelope = 1;
  SourceOrder order = 2;
}

message ArmModeChanged {
  ArmMode mode = 1;
  string principal_id = 2;
}

// A configuration revision took effect (ADR 0012). The document lives in the
// hub's config store; this records when it applied.
message ConfigRevisionApplied {
  uint32 revision = 1;
  string sha256 = 2;
  string principal_id = 3;
}

// The owner cleared the hub's record of a device's source positions (dedup
// windows and held capability positions), e.g. after a poisoned boot epoch or
// a key rotation (ADR 0008 amendment). Capability values are kept.
message SourceReset {
  string device_id = 1;
  string principal_id = 2;
}

// Journal entry (ADR 0008). journal_seq is the only cross-device ordering
// authority. received_at is non-decreasing in journal order.
message JournalEntry {
  uint64 journal_seq = 1;
  int64 received_at_unix_ms = 2;
  bool clock_regressed = 3;
  oneof event {
    ObservationRecorded observation = 4;
    CommandTransition command_transition = 5;
    ArmModeChanged arm_mode_changed = 6;
    ConfigRevisionApplied config_revision_applied = 7;
    SourceReset source_reset = 8;
  }
}
