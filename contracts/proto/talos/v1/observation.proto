syntax = "proto3";

package talos.v1;

import "talos/v1/common.proto";

message ContactState {
  bool open = 1;
}

message MotionState {
  bool detected = 1;
}

message ImpactDetected {
  int32 peak_mg = 1;
  uint32 duration_ms = 2;
}

message TemperatureHumidity {
  int32 temperature_milli_c = 1;
  uint32 humidity_permille = 2;
}

message LockState {
  bool locked = 1;
}

message AudioPlayback {
  bool playing = 1;
}

// Where a camera's media lives (ADR 0020). Video bytes stay in the recorder
// (Frigate); the hub only serves media ids its journal saw from that device.
message MediaRef {
  // Recorder kind, e.g. "frigate". 1-16 of [a-z].
  string store = 1;
  // Recorder's id for the event. 1-128 of [A-Za-z0-9._-].
  string media_id = 2;
  int64 start_unix_ms = 3;
  int64 end_unix_ms = 4;  // 0 while the event is still open
  bool has_clip = 5;
  bool has_snapshot = 6;
}

// Camera/vision detection metadata (never pixels).
message ObjectDetected {
  string label = 1;
  uint32 confidence_permille = 2;
  optional MediaRef media = 3;
}

// Camera stream status from a Vision Node (capability "camera.stream").
message StreamStatus {
  bool up = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps_milli = 4;
  uint32 bitrate_kbps = 5;
  int32 soc_milli_c = 6;
  // Raspberry Pi `vcgencmd get_throttled` bits (0 = never throttled).
  uint32 throttled = 7;
}

// A recorder clip exists for a camera.bookmark command (capability
// "camera.recording"). Its command_id is what verifies the bookmark.
message ClipRecorded {
  string command_id = 1;
  MediaRef media = 2;
}

// Periodic device supervision report.
message Heartbeat {
  uint32 battery_mv = 1;
}

// Enclosure tamper loop of a device (lid switch, wall-removal switch).
// open = lid open or loop cut.
message TamperState {
  bool open = 1;
}

message ObservationPayload {
  oneof kind {
    ContactState contact = 1;
    MotionState motion = 2;
    ImpactDetected impact = 3;
    TemperatureHumidity temperature_humidity = 4;
    LockState lock = 5;
    AudioPlayback audio_playback = 6;
    ObjectDetected object_detected = 7;
    Heartbeat heartbeat = 8;
    TamperState tamper = 9;
    StreamStatus stream_status = 10;
    ClipRecorded clip_recorded = 11;
  }
}

// Normalized sensor evidence entering the hub (spec §22).
message ObservationEnvelope {
  uint32 schema_version = 1;
  string property_id = 2;
  CapabilityRef source = 3;
  optional string module_id = 4;
  string event_type = 5;
  // Stable across transport retries.
  string event_id = 6;
  SourcePosition position = 7;
  // Device clock; may be wrong or absent. Never used for ordering.
  optional int64 observed_at_unix_ms = 8;
  ObservationPayload payload = 9;
  optional string causation_id = 10;
}
