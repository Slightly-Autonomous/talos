# Requirements traceability (spec §56). Status values:
# requested | implemented | verified_sim | verified_hil | released
requirements:
  - id: REQ-001
    statement: Local intrusion processing does not require cloud connectivity
    subsystem: core
    test: //core/engine:engine_test, //simulation/runner:scenario_test
    severity: critical
    status: verified_sim
  - id: REQ-002
    statement: Four sensor module ports are validated against wake, bus, rail and active power-source budgets
    subsystem: core.manifest
    test: //core/manifest:manifest_test, //codec:yaml_loader_test, //firmware/sim:node_test (Discovery.*)
    severity: critical
    status: implemented
  - id: REQ-003
    statement: No duplicate physical action from one retried command or redelivered event
    subsystem: core.execution
    test: //core/execution:ledger_test, //simulation/runner:scenario_test (duplicate_delivery, hub_restart_mid_intrusion)
    severity: high
    status: implemented
  - id: REQ-004
    statement: Firmware can be factory flashed, OTA updated and recovered
    subsystem: firmware.ota
    test: //firmware/sim:node_test (Ota.*, incl. power cut at every store write); tests/hil (boot/epoch) pending hardware
    severity: critical
    status: verified_sim
  - id: REQ-005
    statement: Replay from the journal reproduces state exactly; snapshot plus tail equals full replay
    subsystem: core.state
    test: //core/state:state_test
    severity: critical
    status: implemented
  - id: REQ-006
    statement: Cross-device ordering comes only from hub journal_seq; device clocks never order events
    subsystem: core.journal
    test: //core/state:state_test (DeviceClockDoesNotAffectOrdering, metamorphic)
    severity: critical
    status: implemented
  - id: REQ-007
    statement: Expired commands are never dispatched; late evidence is recorded faithfully
    subsystem: core.execution
    test: //core/execution:ledger_test
    severity: critical
    status: implemented
  - id: REQ-008
    statement: Only verified commands are reported as successful
    subsystem: core.execution, web
    test: //core/execution:ledger_test, web/src/contracts.test.ts
    severity: critical
    status: implemented
  - id: REQ-009
    statement: Scenarios are deterministic across runs and platforms (same seed, identical journal)
    subsystem: simulation
    test: //simulation/runner:scenario_test, //simulation/base:base_test
    severity: high
    status: implemented
  - id: REQ-010
    statement: A command is never reported verified unless the action physically happened (twin ground truth)
    subsystem: core.execution, simulation
    test: //simulation/runner:scenario_test (always-on invariant; speaker_silent_ack, lock_jammed, lock_with_door_open)
    severity: critical
    status: verified_sim
  - id: REQ-011
    statement: Security-critical commands are denied when target state is stale; agents cannot unlock or disarm
    subsystem: core.policy, core.engine
    test: //simulation/runner:scenario_test (stale_lock_state_blocks_command, agent_cannot_unlock_or_disarm)
    severity: critical
    status: verified_sim
  - id: REQ-012
    statement: The hub journal is durable across restarts and refuses to start on corrupt or newer-schema storage
    subsystem: server.persistence
    test: //server/persistence:sqlite_journal_test, //server:server_test (RestartRebuildsHistoryFromSqlite)
    severity: critical
    status: implemented
  - id: REQ-013
    statement: Devices may only report for themselves; people and devices use separate credentials and APIs
    subsystem: server.auth
    test: //server:server_test (HttpE2E.HealthIsPublic..., IntrusionRuleCommandAckAndVerificationOverHttp)
    severity: critical
    status: implemented
  - id: REQ-014
    statement: Supabase holds an idempotent, resumable, read-only copy; the hub stays authoritative
    subsystem: connectors.supabase_sync
    test: connectors/supabase_sync/src/sync.test.ts
    severity: high
    status: implemented
  - id: REQ-015
    statement: From the browser, a user sees simulated backyard motion trigger a verified speaker warning and can replay the full history
    subsystem: web, tools.devsim
    test: web/e2e/intrusion.spec.ts
    severity: high
    status: implemented
  - id: REQ-016
    statement: The UI never shows missing/stale data as clear or an unverified command as successful
    subsystem: web
    test: web/src/model/view.test.ts, web/e2e/intrusion.spec.ts (silent-ACK speaker)
    severity: critical
    status: implemented
  - id: REQ-017
    statement: Layout and rule changes are versioned, owner-only, journaled; history is shown with the layout in force at the time
    subsystem: server, core.engine, web
    test: //server:server_test (ConfigIsVersioned..., RemovingTheRule...), web/e2e/intrusion.spec.ts (layout and rule edits)
    severity: critical
    status: implemented
  - id: REQ-018
    statement: Rule preview dry-runs against history with exactly the engine's semantics and dispatches nothing
    subsystem: core.engine
    test: //core/engine:engine_test (PreviewMatchesWhatTheEngineDid), //server:server_test (RulePreviewDryRunsAgainstHistory)
    severity: high
    status: implemented
  - id: REQ-019
    statement: Contact bounce never produces more than one transition; reboots never look like door openings
    subsystem: firmware.portable
    test: //firmware/sim:node_test (Contact.*), //firmware/sim:node_hub_test
    severity: high
    status: verified_sim
  - id: REQ-020
    statement: Unacknowledged critical events survive link outages and resets and are delivered once
    subsystem: firmware.portable
    test: //firmware/sim:node_test (Delivery.*, Persistence.*), //firmware/sim:node_hub_test
    severity: critical
    status: verified_sim
  - id: REQ-021
    statement: Optional high-power modules never starve critical sensing; low battery degrades optional work first
    subsystem: firmware.portable
    test: //firmware/sim:node_test (Discovery.CameraDisabledOnBattery..., Power.*)
    severity: critical
    status: verified_sim
  - id: REQ-022
    statement: Device frames are authenticated per device; forged, unknown or replayed traffic causes no journal effect
    subsystem: server.coap, firmware.portable.wire
    test: //server:coap_test (ForgedUnknownBadPathDuplicateAndRateLimited), //firmware/portable:wire_test
    severity: critical
    status: verified_sim
  - id: REQ-023
    statement: Only Ed25519-signed releases from configured owner keys are offered; campaigns update nodes end to end with rollback safety
    subsystem: server, firmware.ota
    test: //server:coap_test (SignedOtaCampaignUpdatesTheNodeEndToEnd)
    severity: critical
    status: verified_sim
  - id: REQ-024
    statement: Device health is projected from telemetry; never-reporting or silent devices are offline, never healthy
    subsystem: server.device_registry
    test: //server:coap_test (DebouncedDoorReachesTheJournalOnce...)
    severity: high
    status: verified_sim
  - id: REQ-025
    statement: Supabase JWTs authenticate only mapped users; forged, expired, wrong-audience and alg=none tokens are rejected
    subsystem: server.auth
    test: //server:server_test (SupabaseAuth.AcceptsMappedValidTokensOnly)
    severity: critical
    status: implemented
  - id: REQ-026
    statement: AI agents get read/plan tools and policy-capped requests only; no unlock, disarm or rule saving; hub data is framed as untrusted
    subsystem: connectors.mcp_server, core.policy
    test: connectors/mcp_server/src/server.test.ts, //core/policy:policy_test
    severity: critical
    status: implemented
  - id: REQ-027
    statement: Sensor-node card configurations are rejected when they need a missing wake line, a different connector revision, a reserved root I2C address, more UARTs than the board has, or more power than the active source provides
    subsystem: core.manifest
    test: //codec:yaml_loader_test (SensorNodeRevA.HW_MF_001..009, RootAddressConflictRejected)
    severity: high
    status: verified_sim
  - id: REQ-028
    statement: Sensor Node and card schematics open in KiCad, pass ERC with zero errors, and their exported netlists match the generator's intended connectivity
    subsystem: hardware.kicad
    test: hardware/scripts/check_kicad.py -> hardware/results/
    severity: high
    status: implemented
