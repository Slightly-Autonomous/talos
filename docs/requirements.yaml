# Requirements traceability (spec §56). Status values:
# requested | implemented | verified_sim | verified_hil | released
# `tl_sn_002`: how a requirement written for the four-slot TL-SN-001 applies to the
# self-contained TL-SN-002 (ADR 0019). "retired" requirements stay in force for the archived
# TL-SN-001 (still built and tested in CI) and are never deleted.
requirements:
  - id: REQ-001
    statement: Local intrusion processing does not require cloud connectivity
    subsystem: core
    test: //core/engine:engine_test, //simulation/runner:scenario_test
    severity: critical
    status: verified_sim
  - id: REQ-002
    statement: Four sensor module ports are validated against wake, bus, rail and active power-source budgets
    subsystem: core.manifest
    test: //core/manifest:manifest_test, //codec:yaml_loader_test, //firmware/sim:node_test (Discovery.*)
    severity: critical
    status: implemented
    tl_sn_002: "retired (ADR 0019): no module ports; its four built-in sensors are always populated, validated by REQ-044"
  - id: REQ-003
    statement: No duplicate physical action from one retried command or redelivered event
    subsystem: core.execution
    test: //core/execution:ledger_test, //simulation/runner:scenario_test (duplicate_delivery, hub_restart_mid_intrusion)
    severity: high
    status: implemented
  - id: REQ-004
    statement: Firmware can be factory flashed, OTA updated and recovered
    subsystem: firmware.ota
    test: //firmware/sim:node_test (Ota.*, incl. power cut at every store write); tests/hil (boot/epoch) pending hardware
    severity: critical
    status: verified_sim
    tl_sn_002: "applies: factory flash over the node's USB-C (USB Serial/JTAG) through one command, REQ-047"
  - id: REQ-005
    statement: Replay from the journal reproduces state exactly; snapshot plus tail equals full replay
    subsystem: core.state
    test: //core/state:state_test
    severity: critical
    status: implemented
  - id: REQ-006
    statement: Cross-device ordering comes only from hub journal_seq; device clocks never order events
    subsystem: core.journal
    test: //core/state:state_test (DeviceClockDoesNotAffectOrdering, metamorphic)
    severity: critical
    status: implemented
  - id: REQ-007
    statement: Expired commands are never dispatched; dispatch is the adapter hand-off, so a command whose TTL passes while queued is never delivered; late evidence is recorded faithfully
    subsystem: core.execution, core.engine, server
    test: //core/execution:ledger_test, //core/engine:engine_test (CommandNotHandedOffWithinTtlExpiresAndIsNeverSent), //server:server_test (HttpE2E.ExpiredCommandIsNeverHandedToTheDevice)
    severity: critical
    status: implemented
  - id: REQ-008
    statement: Only verified commands are reported as successful; the verifying observation is derived on the hub from the operation, never chosen by the caller; ack-only commands never verify
    subsystem: core.execution, web
    test: //core/execution:ledger_test, //core/execution:operations_test, //server:server_test (HttpE2E.CallerCannotChooseWhatIsFreshOrWhatVerifies), web/src/contracts.test.ts
    severity: critical
    status: implemented
  - id: REQ-009
    statement: Scenarios are deterministic across runs and platforms (same seed, identical journal)
    subsystem: simulation
    test: //simulation/runner:scenario_test, //simulation/base:base_test
    severity: high
    status: implemented
  - id: REQ-010
    statement: A command is never reported verified unless the action physically happened (twin ground truth)
    subsystem: core.execution, simulation
    test: //simulation/runner:scenario_test (always-on invariant; speaker_silent_ack, lock_jammed, lock_with_door_open)
    severity: critical
    status: verified_sim
  - id: REQ-011
    statement: Security-critical commands are denied when target state is stale; agents cannot unlock or disarm, including by sending unlock args under a low-risk operation
    subsystem: core.policy, core.engine
    test: //simulation/runner:scenario_test (stale_lock_state_blocks_command, agent_cannot_unlock_or_disarm), //server:server_test (HttpE2E.AgentCannotSmuggleUnlockArgsUnderALowRiskOperation)
    severity: critical
    status: verified_sim
  - id: REQ-012
    statement: The hub journal is durable across restarts and refuses to start on corrupt or newer-schema storage
    subsystem: server.persistence
    test: //server/persistence:sqlite_journal_test, //server:server_test (RestartRebuildsHistoryFromSqlite)
    severity: critical
    status: implemented
  - id: REQ-013
    statement: Devices may only report for themselves; people and devices use separate credentials and APIs
    subsystem: server.auth
    test: //server:server_test (HttpE2E.HealthIsPublic..., IntrusionRuleCommandAckAndVerificationOverHttp)
    severity: critical
    status: implemented
  - id: REQ-014
    statement: Supabase holds an idempotent, resumable, read-only copy; the hub stays authoritative
    subsystem: connectors.supabase_sync
    test: connectors/supabase_sync/src/sync.test.ts
    severity: high
    status: implemented
  - id: REQ-015
    statement: From the browser, a user sees simulated backyard motion trigger a verified speaker warning and can replay the full history
    subsystem: web, tools.devsim
    test: web/e2e/intrusion.spec.ts
    severity: high
    status: implemented
  - id: REQ-016
    statement: The UI never shows missing/stale data as clear or an unverified command as successful
    subsystem: web
    test: web/src/model/view.test.ts, web/e2e/intrusion.spec.ts (silent-ACK speaker)
    severity: critical
    status: implemented
  - id: REQ-017
    statement: Layout and rule changes are versioned, owner-only, journaled; history is shown with the layout in force at the time
    subsystem: server, core.engine, web
    test: //server:server_test (ConfigIsVersioned..., RemovingTheRule...), web/e2e/intrusion.spec.ts (layout and rule edits)
    severity: critical
    status: implemented
  - id: REQ-018
    statement: Rule preview dry-runs against history with exactly the engine's semantics and dispatches nothing
    subsystem: core.engine
    test: //core/engine:engine_test (PreviewMatchesWhatTheEngineDid), //server:server_test (RulePreviewDryRunsAgainstHistory)
    severity: high
    status: implemented
  - id: REQ-019
    statement: Contact bounce never produces more than one transition; reboots never look like door openings
    subsystem: firmware.portable
    test: //firmware/sim:node_test (Contact.*), //firmware/sim:node_hub_test
    severity: high
    status: verified_sim
  - id: REQ-020
    statement: Unacknowledged critical events survive link outages and resets and are delivered once
    subsystem: firmware.portable
    test: //firmware/sim:node_test (Delivery.*, Persistence.*), //firmware/sim:node_hub_test
    severity: critical
    status: verified_sim
  - id: REQ-021
    statement: Optional high-power modules never starve critical sensing; low battery degrades optional work first
    subsystem: firmware.portable
    test: //firmware/sim:node_test (Discovery.CameraDisabledOnBattery..., Power.*)
    severity: critical
    status: verified_sim
  - id: REQ-022
    statement: Device frames are authenticated per device; forged, unknown or replayed traffic causes no journal effect
    subsystem: server.coap, firmware.portable.wire
    test: //server:coap_test (ForgedUnknownBadPathDuplicateAndRateLimited), //firmware/portable:wire_test
    severity: critical
    status: verified_sim
  - id: REQ-023
    statement: Only Ed25519-signed releases from configured owner keys are offered, and only to devices whose board and revision match the release; campaigns update nodes end to end with rollback safety
    subsystem: server, firmware.ota
    test: //server:coap_test (SignedOtaCampaignUpdatesTheNodeEndToEnd, CampaignRefusedForAnotherBoardOrRevision)
    severity: critical
    status: verified_sim
  - id: REQ-024
    statement: Device health is projected from telemetry; never-reporting or silent devices are offline, never healthy; replayed or duplicate uplinks refresh nothing
    subsystem: server.device_registry
    test: //server:coap_test (DebouncedDoorReachesTheJournalOnce...), //server:server_test (HttpE2E.ReplayedHeartbeatDoesNotKeepADeadDeviceAlive)
    severity: high
    status: verified_sim
  - id: REQ-025
    statement: Supabase JWTs authenticate only mapped users; forged, expired, wrong-audience and alg=none tokens are rejected
    subsystem: server.auth
    test: //server:server_test (SupabaseAuth.AcceptsMappedValidTokensOnly)
    severity: critical
    status: implemented
  - id: REQ-026
    statement: AI agents get read/plan tools and policy-capped requests only; no unlock, disarm or rule saving; hub data is framed as untrusted
    subsystem: connectors.mcp_server, core.policy
    test: connectors/mcp_server/src/server.test.ts, //core/policy:policy_test
    severity: critical
    status: implemented
  - id: REQ-027
    statement: Sensor-node card configurations are rejected when they need a missing wake line, a different connector revision, a reserved root I2C address, more UARTs than the board has, or more power than the active source provides
    subsystem: core.manifest
    test: //codec:yaml_loader_test (SensorNodeRevA.HW_MF_001..009, RootAddressConflictRejected)
    severity: high
    status: verified_sim
    tl_sn_002: "retired (ADR 0019): no cards, connectors or card UARTs; root-bus address and power-source checks carry over in REQ-044"
  - id: REQ-028
    statement: Sensor Node and card schematics open in KiCad, pass ERC with zero errors, and their exported netlists match the generator's intended connectivity
    subsystem: hardware.kicad
    test: hardware/scripts/check_kicad.py -> hardware/results/
    severity: high
    status: implemented
    tl_sn_002: "applies when the TL-SN-002 schematic exists (hardware generators, owned by the hardware workstream)"
  - id: REQ-029
    statement: Every twin scenario that a firmware-capable device appears in passes with that device running the real portable firmware (L2), and the device reports the same transitions as its behavioural model (L1)
    subsystem: simulation, firmware.portable
    test: //simulation/runner:backend_parity_test
    severity: high
    status: verified_sim
  - id: REQ-030
    statement: Each command operation fixes its args variant, target capability, risk, TTL bound and verifying observation in one core catalog; mismatched commands are denied before policy; rules act only as capped rule principals
    subsystem: core.execution, core.engine, server.config
    test: //core/execution:operations_test, //core/engine:engine_test, //server:server_test (Config.RulePrincipalsAreAlwaysRulesNeverConfiguredIdentities)
    severity: critical
    status: implemented
  - id: REQ-031
    statement: Device ingress is authenticated before it is rate limited; forged traffic for a device id cannot throttle that device, and observations are accepted only for capabilities the device declares, with a payload that fits the capability
    subsystem: server.coap, core.ingest
    test: //server:coap_test (ForgedFloodCannotThrottleTheGenuineDevice), //core/ingest:ingest_test (CapabilityMustBeDeclaredAndPayloadMustFitIt)
    severity: high
    status: implemented
  - id: REQ-032
    statement: Only an observation that is the target's current state, and newer than its position at dispatch, verifies a command; late reordered reports never do
    subsystem: core.execution, core.engine
    test: //core/engine:engine_test (OutOfOrderOlderObservationNeverVerifies, ReportNotNewerThanDispatchBaselineNeverVerifies), //server:server_test (HttpE2E.StaleObservationNeverVerifiesALockCommand)
    severity: critical
    status: implemented
  - id: REQ-033
    statement: No principal can pre-claim or consume another principal's command ids; rule actions are never silently dropped; command requests are rate limited and denied requests are bounded
    subsystem: core.execution, server.http, web, connectors.mcp_server
    test: //core/execution:ledger_test (DeniedRequestsDoNotConsumeIdsAndAreBounded), //core/engine:engine_test (RuleCommandIdHeldByAnotherPrincipalStillActs), //server:server_test (ForeignPrincipalCannotPreclaimRuleCommandIds, CommandFloodIsRateLimitedAndDenialsAreBounded), web/src/model/commands.test.ts
    severity: high
    status: implemented
  - id: REQ-034
    statement: Device source positions are bounded so one forged report cannot freeze a sensor; devices whose reports are ignored show as faulted; the owner can reset a device's sequence state
    subsystem: core.ingest, server.health
    test: //core/ingest:ingest_test (HugeBootEpochCannotFreezeLaterGenuineBoots), //core/engine:engine_test (SourceResetRecoversAPoisonedDevice), //server:server_test (PoisonedBootEpochIsRefusedSurfacedAndRecoverable)
    severity: high
    status: implemented
  - id: REQ-035
    statement: Replayed or spoofed CoAP datagrams cannot throttle a device or poison its replies; HTTP connections have a request-read deadline and a per-peer cap; live streams keep slots for owners
    subsystem: server.coap, server.http
    test: //server:coap_test (ReplayedFrameFloodCannotThrottleTheGenuineDevice, SpoofedDatagramsCannotPoisonTheRetransmissionCache), //server:server_test (SlowlorisConnectionsAreCutAndCapped, LowPrivilegePrincipalCannotTakeTheOwnersStreams)
    severity: high
    status: implemented
  - id: REQ-036
    statement: Firmware releases are keyed by board, revision and version, never replaced, parsed strictly, and a campaign only ever offers the release it was checked against
    subsystem: server.ota
    test: //server:coap_test (ImportingAnotherBoardsReleaseCannotChangeAScheduledCampaign, FirmwareStore.VersionsParseStrictlyWithoutWrapping)
    severity: critical
    status: implemented
  - id: REQ-037
    statement: Lowering the arm mode (including away to home) is a human, security-critical action; agents may only raise it
    subsystem: core.policy
    test: //core/policy:policy_test (AgentCannotLowerArmMode), //server:server_test (HttpE2E.AgentCannotLowerTheArmMode)
    severity: high
    status: implemented
  - id: REQ-038
    statement: Opening the sensor node's enclosure (or cutting its tamper loop) is a debounced P0 event, also from deep sleep; it is journaled as a tamper.enclosure observation, alarms through rules in every arm mode, and the hub and UI show the device faulted until the lid is closed (missing tamper state is unknown). An opening that reaches the hub late (overtaken by its restore) or only as a cold-boot state report after a known-closed lid still alarms; chatter faster than the debounce is reported open; event ids are owned by their source device
    subsystem: firmware.runtime, core.ingest, core.rules, server.health, simulation.twin, web
    test: //firmware/portable:indicators_test (Tamper.*), //firmware/sim:indicators_tamper_test (Tamper.*, ExpWake.*), //firmware/portable:wire_test (TamperKindRoundTripsAndUnknownKindsAreRefused), //core/engine:engine_test (TamperTest.*), //codec:codec_test (AllPayloadKindsRoundTrip), //server:server_test (TamperOpenFaultsTheDeviceUntilRestored, TamperOverTheDeviceApiIsJournaledAndFaultsHealth, DeviceRegistryTamper.*), //simulation/runner:scenario_test + backend_parity_test (garage_enclosure_*), web/src/model/view.test.ts (enclosure tamper), web/e2e/intrusion.spec.ts (enclosure tamper)
    severity: critical
    status: verified_sim
  - id: REQ-039
    statement: Slot LEDs stay dark on battery (no visible reaction to an intruder) and light only on external power or in a timed service mode; the status LED shows deterministic short-pulse blink codes
    subsystem: firmware.runtime
    test: //firmware/portable:indicators_test (StatusLed.*, SlotLeds.*), //firmware/sim:indicators_tamper_test (SlotLeds.*, StatusLed.*), //firmware/sim:diag_test (LedServiceModeLightsSlotLedsOnBattery)
    severity: high
    status: verified_sim
    tl_sn_002: "applies: the per-sensor lamps reuse the slot-LED policy; TL-SN-002's board lamps follow REQ-045"
  - id: REQ-040
    statement: Each sensor node carries its board name, revision and serial in the permanent partition, written once at program time and checked on the bench
    subsystem: firmware.diag, tools.dbg, tools.bench
    test: //firmware/sim:diag_test (BoardIdIsWrittenOnceAndSurvivesAWorkingPartitionErase), tools/dbg/tests/test_node_id.py, tools/bench/tests/test_runner.py (S-M16)
    severity: medium
    status: verified_sim
    tl_sn_002: "applies: board TL-SN-002 rev A (talos_dbg program-id --node --board TL-SN-002, talos_bench.flash)"
  - id: REQ-041
    statement: Board manifests can restrict a module to some slots (provisional data); on TL-SN-001 the temperature/humidity card is only valid in slots 0 and 2, away from the charger (B-03), and other slots get a slot_not_allowed diagnostic
    subsystem: core.manifest
    test: //codec:yaml_loader_test (B_03_EnvironmentCardOnlyInTheTopSlots)
    severity: medium
    status: implemented
    tl_sn_002: "retired (ADR 0019): TL-SN-002 has no slot limits (the SHT40 placement is a layout rule)"
  - id: REQ-042
    statement: An owner can put one node into a bounded maintenance window (default 30 min, at most 4 h; humans only) during which its tamper alarm is suppressed and the suppression journaled; it ends on the hub clock or on cancel, and a lid still open then alarms; back-to-back windows are capped at 4 h from the first start; other nodes and the node's other alarms and health findings are unaffected
    subsystem: core.execution, core.engine, server.health, simulation.twin, web
    test: //core/engine:engine_test (MaintenanceTest.*), //server:server_test (MaintenanceIsAHumanCommandShownInStateAndHealthUntilItExpires, ProjectHealth.MaintenanceCoversOnlyTheTamperAlarm), //core/engine:engine_test (EngineJournal.AHubInternalCommandLeftAcceptedIsNeverHandedToADevice), //simulation/runner:scenario_test + backend_parity_test (garage_enclosure_maintenance), web/src/model/view.test.ts (maintenance, device tone), web/src/model/commands.test.ts, web/e2e/intrusion.spec.ts (maintenance)
    severity: high
    status: verified_sim
  - id: REQ-043
    statement: A press of the node's BOOT button toggles slot-LED service mode without a laptop, debounced on the injected clock and without affecting the strap or download mode
    subsystem: firmware.runtime
    test: //firmware/portable:indicators_test (ServiceButton.*), //firmware/sim:indicators_tamper_test (ServiceButton.*)
    severity: low
    status: verified_sim
    tl_sn_002: "applies unchanged (BOOT is GPIO9 on both boards)"
  - id: REQ-044
    statement: Boards may declare built-in modules; a built-in slot is always populated with exactly its module, skips connector, mux-branch, per-slot rail and slot-limit checks, shares the root bus (address conflicts and reserved board addresses still checked) and counts against the active source's power budget; TL-SN-001 validation is unchanged
    subsystem: core.manifest, codec, contracts
    test: //codec:yaml_loader_test (SensorNodeV2.*), //core/manifest:manifest_test, tools/dbg/tests/test_contracts.py (Sn002ManifestMatchesFirmware)
    severity: high
    status: verified_sim
  - id: REQ-045
    statement: TL-SN-002 firmware runs its built-in sensors without ID EEPROMs, a mux or presence lines (card removal never fires); wakes from deep sleep on five active-high lines (MAG, ACC, PIR, tamper, USER); drives eight lamps through the existing policy (dark on battery unless service mode, lit on USB); a faulting built-in sensor is disabled and reported (P0 when critical) and retried with backoff, the PIR by a power cycle of its rail
    subsystem: firmware.portable, firmware.sim
    test: //firmware/sim:sn002_test, //firmware/portable:wire_test (kUserButton)
    severity: high
    status: verified_sim
  - id: REQ-046
    statement: A short USER press sends a test report (a heartbeat now) and blinks every lamp for 10 s; a long press (>= 3 s) sends one commissioning request; both are P1 kUserButton diagnostics that the hub records and never acts on. Primary AA cells are judged by their voltage under load (2.2 V pair = low battery), and the hub asks for new cells, never a charge
    subsystem: firmware.runtime, server.health, simulation.twin
    test: //firmware/sim:sn002_test (Sn002User.*, Sn002Power.*), //server:server_test (Sn002UserButtonAaLowBatteryAndBuiltInFaults), //simulation/runner:scenario_test + backend_parity_test (garage_user_test_report, garage_aa_low_battery)
    severity: medium
    status: verified_sim
  - id: REQ-047
    statement: A TL-SN-002 is flashed, given its board identity and self-tested over its USB-C port by one command; a missing flasher is reported as skipped, never faked
    subsystem: tools.bench, tools.dbg
    test: tools/bench/tests/test_flash.py, tools/bench/tests/test_sn002.py
    severity: medium
    status: verified_sim
  - id: REQ-048
    statement: The twin's garage and driveway nodes are TL-SN-002 and run on its L2 board model; every scenario and L1/L2 parity still pass
    subsystem: simulation
    test: //simulation/runner:backend_parity_test (Binding.GarageNodesRunOnTheTlSn002Model, Corpus/*)
    severity: high
    status: verified_sim
  - id: REQ-049
    statement: A TL-SN-002 node reports each tamper cause as its own capability (tamper.enclosure, tamper.battery_door, tamper.mount, tamper.magnet); every cause alarms through the tamper rules and maintenance like the lid, and unknown is never shown as closed
    subsystem: firmware/hub/web
    test: //firmware/sim:sn002_tamper_test, //server:server_test (HubBridge.EachTamperCauseHasItsOwnCapability), //simulation/runner:backend_parity_test (garage_battery_door_tamper), web view.test.ts
    severity: critical
    status: verified_sim
  - id: REQ-050
    statement: A node's sleep design is configurable per device (deep sleep by default with event-to-hub <= 2 s, sleepy child, always on) and USB power always runs always-on
    subsystem: firmware/hub
    test: //firmware/portable:tamper_sleep_test, //firmware/sim:sn002_tamper_test (Sn002Sleep), //firmware/portable:wire_test (Config2); tools/otns/thread_latency.py for the Thread budget
    severity: high
    status: verified_sim
  - id: REQ-051
    statement: On primary cells below the low-battery threshold the radio is capped at +10 dBm; every cold boot reports its reset cause, and a USB reset with the enclosure shut counts as USB probing
    subsystem: firmware/hub
    test: //firmware/sim:sn002_tamper_test (Sn002TxPower, Sn002Reset), //server:server_test (Sn002UsbResetWhileClosedIsProbingEvidence)
    severity: high
    status: verified_sim
  - id: REQ-052
    statement: The hub serves a camera snapshot or clip only to a human principal with at least a sensitive_read grant, and only for a media id that device's journaled observations named; agents, rules and devices never receive images, and the recorder is never asked for anything else
    subsystem: server/core.policy/core.events
    test: //server:server_test (HttpE2E.MediaIsServedOnlyForJournaledIdsAndOnlyToPeople, HttpE2E.MediaWithoutARecorderIsUnavailableAndTheIndexSurvivesRestart), //core/policy:policy_test (Policy.MediaIsForHumansWithASensitiveReadGrant), //core/events:observation_test (ValidateEnvelope.MediaReferencesAreBounded)
    severity: critical
    status: verified_sim
  - id: REQ-053
    statement: A camera.bookmark is VERIFIED only by a ClipRecorded observation carrying its own command id; a clip for another command never verifies it, and a late clip is recorded with late=true
    subsystem: core.execution/server
    test: //core/execution:ledger_test (Ledger.BookmarkVerifiesOnTheClipForThisCommandOnly), //core/execution:operations_test (Operations.BookmarkDefaultsBoundsAndClipExpectation), //server:server_test (HttpE2E.BookmarkIsVerifiedOnlyByTheClipForThatCommand)
    severity: high
    status: verified_sim
  - id: REQ-054
    statement: A Vision Node whose camera stream is down, stale or never reported is DEGRADED, never healthy
    subsystem: server
    test: //server:server_test (HttpE2E.VisionNodeWithItsStreamDownIsDegradedNeverHealthy)
    severity: high
    status: verified_sim
  - id: REQ-055
    statement: The Vision Node agent reports its lid (debounced 50 ms, sensed every 20 ms and never blocked by the network), its camera stream (a stalled or missing stream is down) and heartbeats inside the hub's freshness age, with Unix-second boot epochs taken only after NTP sync, and keeps reports in order while the hub is unreachable
    subsystem: firmware.vision_node
    test: firmware/vision_node/tests (test_agent.py, test_real_hub.py against the real hub binary, test_board.py against the manifest)
    severity: high
    status: verified_sim
  - id: REQ-056
    statement: A Vision Node SD card is provisioned by one tool with per-camera secrets that never enter the repository, a verified MediaMTX binary, Wi-Fi and Bluetooth off and the hardware watchdog on
    subsystem: tools.provision
    test: firmware/vision_node/tests/test_provision.py
    severity: medium
    status: implemented
  - id: REQ-057
    statement: In the twin, a Vision Node's stream is reported down at once when it stops; Frigate's view of that camera then sends no detections or heartbeats and no clip, so a bookmark is never verified without footage, and a PIR intrusion is still handled; an unreachable recorder never yields a successful bookmark; the camera's lid raises the tamper alarm
    subsystem: simulation
    test: //simulation/runner:scenario_test and //simulation/runner:backend_parity_test (vision_backyard_bookmark_verified, vision_stream_down_intrusion_still_handled, vision_frigate_unreachable_bookmark_not_success, vision_lid_opened_alarm)
    severity: high
    status: verified_sim
