# Hardware requirements (H0). status: proposed | designed (in schematic) | verified_tool (tool output captured)
# | measured (bench). Nothing is `measured` yet. Tests point at the artifact that checks the requirement.
schema_version: talos.hardware.req.v0
requirements:
  - id: HWR-001
    statement: The hub is a bought computer plus USB 802.15.4 RCP; no bespoke hub PCB
    board: TL-HUB-REF
    status: proposed
    test: hardware/bom/devkit_rig_v0.csv
  - id: HWR-002
    statement: The Sensor Node accepts four interchangeable cards through one connector standard (sensor_edge_v1)
    board: TL-SN-001
    status: verified_tool
    test: hardware/results/kicad-check.md (cross-board connector check)
  - id: HWR-003
    statement: Each slot has a dedicated wake line usable from deep sleep (ESP32-H2 LP GPIO8-14)
    board: TL-SN-001
    status: designed
    test: hardware/pins/esp32h2_mini1_pin_ledger.csv; bench HD-004
  - id: HWR-004
    statement: Each slot has an isolated I2C branch; identical card addresses on different slots never conflict
    board: TL-SN-001
    status: verified_tool
    test: //core/manifest:manifest_test (HW_MF_002, HW_MF_003)
  - id: HWR-005
    statement: Card devices never use a reserved root I2C address (0x20, 0x21, 0x6A, 0x70)
    board: TL-SN-001
    status: verified_tool
    test: //core/manifest:manifest_test (RootAddressConflictRejected)
  - id: HWR-006
    statement: Unpowered cards are not backfed through I2C; branch pull-ups and branch devices are on the slot AON rail
    board: TL-SN-001
    status: designed
    test: EE review + bench leakage test (interface-test-matrix IT-07)
  - id: HWR-007
    statement: Every output that controls power, reset or chip select has a resistor-defined safe default at power-up
    board: TL-SN-001, TL-SN-002
    status: verified_tool
    test: hardware/scripts/check_kicad.py (safe-default check) -> hardware/results/kicad-check.md
  - id: HWR-008
    statement: Runs from USB-C alone with no battery, from battery alone, and from PV+battery; USB has priority over PV; no cross-feed
    board: TL-SN-001
    status: designed
    test: hardware/power/power-tree.md mode matrix; bench
  - id: HWR-009
    statement: Battery-only deep-sleep budget with four reference cards is under 40 uA at the battery (estimate until measured)
    board: TL-SN-001
    status: verified_tool
    test: hardware/scripts/power_budget.py (asserts) -> hardware/results/power-budget.md
  - id: HWR-010
    statement: No charger path is ever connected to a primary (non-rechargeable) cell
    board: TL-SN-001, TL-SN-002
    status: designed
    test: keyed 3-pin protected-pack connector; EE review
  - id: HWR-011
    statement: Battery temperature is sensed by the charger (NTC on BQ25186 TS/MR)
    board: TL-SN-001
    status: designed
    test: schematic net BAT_NTC
  - id: HWR-012
    statement: Factory flashing and test need only pads and USB-C (no populated headers, no hand soldering)
    board: TL-SN-001, TL-SN-002
    status: designed
    test: schematic test-point list
  - id: HWR-013
    statement: Each card carries an ID EEPROM at 0x50 on its slot branch, powered from AON
    board: TL-MOD-001..004, TL-TEST-001
    status: verified_tool
    test: hardware/results/pin-to-net/*.csv; hardware/results/kicad-check.md
  - id: HWR-014
    statement: The Vision Node is a separate board with zero sensor slots
    board: TL-VN-001
    status: verified_tool
    test: //core/manifest:manifest_test (HW_MF_009)
  - id: HWR-015
    statement: Board manifests carry no pin numbers; pins are compiled into the signed firmware BoardSupport table only
    board: all, TL-SN-002
    status: verified_tool
    test: contracts/proto/talos/v1/manifest.proto (no pin fields); firmware/esp_idf/main/board_tl_sn_001.h
  - id: HWR-016
    statement: Every schematic opens in KiCad 10 and passes ERC with zero errors; the exported netlist matches the generator's intended netlist
    board: TL-SN-001, TL-SN-002, TL-MOD-001..004, TL-TEST-001, TL-DBG-001
    status: verified_tool
    test: hardware/scripts/check_kicad.py -> hardware/results/
  - id: HWR-017
    statement: Every routed PCB passes kicad-cli DRC with schematic parity at zero errors under the project fab rules
    board: TL-SN-001, TL-SN-002, TL-MOD-001..004, TL-TEST-001, TL-DBG-001
    status: verified_tool
    test: hardware/scripts/check_kicad.py -> hardware/results/kicad-check.md (PCB DRC columns)
  - id: HWR-018
    statement: Every assembled part is stocked by JLCPCB, with enough stock for 5 of every board; a part JLCPCB cannot place is listed as not placed with a risk ID
    board: TL-SN-001, TL-MOD-001..004, TL-TEST-001, TL-DBG-001
    status: verified_tool
    test: hardware/scripts/jlc_sourcing.py check (snapshot hardware/sourcing/jlc-stock.json; refresh before ordering)
  - id: HWR-019
    statement: Any single card can be powered, measured and exercised from a PC over USB in the same electrical environment as a main-board slot (same socket pinout, rail switches, pull-ups and ESD); rails default off
    board: TL-DBG-001
    status: designed
    test: hardware/scripts/check_kicad.py cross-board check (HOSTS); tools/dbg tests (configure, rail sequencing, card ID, against a simulated MCP2221A); bench bring-up not done
  - id: HWR-019
    statement: TL-SN-002 is one self-contained board with every sensor soldered on (3-axis Hall, accelerometer, temperature/humidity, PIR); no slots or cards (ADR 0019)
    board: TL-SN-002
    status: designed
    verification: generator netlist (gen_schematics.py sensor_node_v2) and layout_rules.py
  - id: HWR-020
    statement: TL-SN-002 is assembled 100 % by JLCPCB (SMT + JLCPCB through-hole); the radio module is the one owner-approved global-sourcing exception (HD-023)
    board: TL-SN-002
    status: verified_tool
    verification: jlc_sourcing.py check (no not_placed parts on TL-SN-002)
  - id: HWR-021
    statement: TL-SN-002 runs from 2 x AA primary cells or USB-C; USB has priority; the cells are never charged and never back-fed (TPS2116 priority mux, reverse-cell P-FET)
    board: TL-SN-002
    status: designed
    verification: spice_sim.py B10/B11; bench
  - id: HWR-022
    statement: TL-SN-002 battery-only deep-sleep current is under 40 uA at the cells, with every sensor on and lamps dark (estimate until measured)
    board: TL-SN-002
    status: verified_tool
    verification: power_budget_sn2.py (CI)
  - id: HWR-023
    statement: TL-SN-002 flashes, logs and debugs over its USB-C (ESP32-H2 USB Serial/JTAG); Tag-Connect UART0 pads are the recovery path
    board: TL-SN-002
    status: designed
    verification: bench
  - id: HWR-024
    statement: TL-SN-002 has debug lamps (PWR, STAT, LINK, MAG, VIB, PIR, ENV, TAMP, BATT, FLT) on one edge and RST/BOOT/USER buttons; firmware lamps stay dark on battery unless service mode
    board: TL-SN-002
    status: designed
    verification: layout_rules.py (lamp strip), firmware indicator tests
  - id: HWR-025
    statement: TL-SN-002's SHT40 sits on a slotted thermal tongue and its Hall sensor on the board edge facing the magnet
    board: TL-SN-002
    status: verified_tool
    verification: layout_rules.py

  - id: HWR-026
    statement: TL-SN-002 senses its lid and its tool-free battery door on the board (SW4, SW5 in series on the tamper wake line) and tells them apart (TAMPER_DOOR on EXP P11); no wiring to fit at install (owner 2026-11-22, HD-049)
    board: TL-SN-002
    status: designed
    verification: test_generators.py (tamper chain), sn002_tamper_test (sim); bench S-M22
  - id: HWR-027
    statement: TL-SN-002 carries housing keep-outs (User.Eco1), a conformal-coat keep-out map (User.Eco2) and a STEP export; the printed housing is generated from the routed board (B-04/B-05/B-06)
    board: TL-SN-002
    status: verified_tool
    verification: layout_rules.py (housing marks), housing.py --check
  - id: HWR-028
    statement: Every TL-SN-002 footprint follows its part's datasheet drawing; the PIR223D-S0 uses its own 90-degree lead pattern (HD-044)
    board: TL-SN-002
    status: designed
    verification: datasheet check 2026-11-22; bench fit on the first boards
